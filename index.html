<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ryan Behan — research notes</title>
<meta name="description" content="Experiments, benchmarks, and notes on AI infrastructure — with real data." />
<link rel="icon" href="data:," />
<style>
:root{
  --bg:#fafaf8; --ink:#16161a; --muted:#6b6f7a; --rule:#e3e2dd;
  --accent:#4f46e5; --accent-soft:#c7c5f4; --green:#16a34a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans)}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
header{padding:80px 0 30px;border-bottom:1px solid var(--rule)}
.eyebrow{font:12px var(--mono);color:var(--accent);letter-spacing:.12em;text-transform:uppercase}
h1{font-size:34px;line-height:1.2;margin:10px 0 12px;letter-spacing:-.01em}
.sub{color:var(--muted);max-width:58ch}
.posts{padding:10px 0 40px}
.post{display:block;color:var(--ink);border:1px solid var(--rule);border-radius:12px;
  background:#fff;padding:20px 22px;margin:14px 0;transition:border-color .15s}
.post:hover{border-color:var(--accent-soft);text-decoration:none}
.post .date{font:12px var(--mono);color:var(--muted)}
.post h2{font-size:19px;margin:4px 0 6px;letter-spacing:-.01em}
.post p{margin:0;color:#3f4148;font-size:14.5px}
.post .tags{margin-top:12px}
.tag{display:inline-block;font:11px var(--mono);color:var(--accent);
  background:#eef0ff;border:1px solid var(--accent-soft);border-radius:99px;padding:2px 9px;margin-right:6px}
.post .go{font:12px var(--mono);color:var(--muted);margin-top:10px}
.post:hover .go{color:var(--accent)}
footer{border-top:1px solid var(--rule);padding:26px 0 60px;font:12px var(--mono);color:var(--muted)}
@media(max-width:640px){header{padding:56px 0 24px}h1{font-size:27px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">ryanbehan</div>
    <h1>Research notes</h1>
    <p class="sub">Experiments, benchmarks, and working demos on AI infrastructure and
    agent tooling. Everything here is generated from real runs — costs, traces,
    failures included.</p>
  </header>
  <main class="posts" id="posts"></main>
  <footer>
    <a href="https://github.com/ryanbehan/ryanbehan.github.io">source</a> ·
    generated reports are standalone HTML — no trackers, no external assets
  </footer>
</div>
<script>
// new post = drop the html in posts/ and add an entry here
const POSTS = [
  {
    file: "2026-10-30-decision-models-playwright.html",
    date: "2026-10-30",
    title: "Decision models × Playwright: QA without selectors",
    dek: "A decision model navigates a live app, pauses at destructive actions, and exports a deterministic Playwright spec — plus decision calls as test assertions. Six models, real traces, embedded video.",
    tags: ["decisions api", "playwright", "agents", "qa"],
  },
  {
    file: "2026-10-29-decision-apis-benchmark.html",
    date: "2026-10-29",
    title: "Decisions APIs: an evaluation report",
    dek: "Six decision models compared on classification, a command-safety gate, cost, and latency — 6,890 live calls, ~$0.14 total. Plus what an AWS/Bedrock shop should consider.",
    tags: ["decisions api", "benchmark", "agents", "aws"],
  },
];
document.getElementById("posts").innerHTML = POSTS.map(p => `
  <a class="post" href="posts/${p.file}">
    <div class="date">${p.date}</div>
    <h2>${p.title}</h2>
    <p>${p.dek}</p>
    <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
    <div class="go">read →</div>
  </a>`).join("");
</script>
</body>
</html>
