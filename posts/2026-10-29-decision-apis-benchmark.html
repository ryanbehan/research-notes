<script>
// Runs in <head> before paint. Theme choice is shared with the blog index via localStorage("rb-theme").
(() => {
  const THEMES = ["neon", "paper", "term"];
  const root = document.documentElement;
  let t = "neon";
  try { const s = localStorage.getItem("rb-theme"); if (THEMES.includes(s)) t = s; } catch {}
  root.dataset.theme = t;
  document.addEventListener("DOMContentLoaded", () => {
    const nav = document.querySelector("nav.top .inner");
    if (!nav) return;
    const box = document.createElement("span");
    box.className = "rb-themes";
    const blog = location.pathname.includes("/posts/") ? `<a href="../">← all posts</a>` : "";
    box.innerHTML = `${blog}<span class="sw" role="group" aria-label="Color theme">${THEMES.map(x =>
      `<button data-t="${x}" aria-pressed="${x === t}">${x}</button>`).join("")}</span>`;
    nav.appendChild(box);
    box.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-t]");
      if (!b || b.dataset.t === root.dataset.theme) return;
      try { localStorage.setItem("rb-theme", b.dataset.t); } catch {}
      // charts are drawn with the active palette, so pages that draw them re-render via reload
      if (root.hasAttribute("data-theme-reload")) return location.reload();
      root.dataset.theme = b.dataset.t;
      box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    });
  });
})();
</script>

function animateAll(root){root.querySelectorAll(".grow").forEach(g=>REDUCED?g.classList.add("shown"):io.observe(g));}
function T(x,y,txt,o={}){
  return `<text x="${x}" y="${y}" font-family="ui-monospace,Menlo,monospace" font-size="${o.fs||11}" fill="${o.fill||C.ink}" text-anchor="${o.a||"start"}"${o.w?` font-weight="${o.w}"`:""}>${esc(txt)}</text>`;
}
const tip=(s)=>`<title>${esc(s)}</title>`;
const HATCH=`<defs><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${C.track}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${C.grey}" stroke-width="1.2"/></pattern></defs>`;

/* generic horizontal bars */
function hBars(rows,o={}){
  const W=o.W||920, labelW=o.labelW||200, valW=o.valW||76, noteW=o.noteW||140;
  const bh=o.bh||20, gap=o.gap||10, barW=W-labelW-valW-noteW-24;
  const max=o.max ?? Math.max(...rows.map(r=>r.value))*1.1;
  const H=12+rows.length*(bh+gap)-gap;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||"bar chart")}">${HATCH}`;
  rows.forEach((r,i)=>{
    const y=6+i*(bh+gap), w=Math.max(0,Math.min(1,r.value/max))*barW;
    s+=`<g>${tip(r.tip||`${r.label}: ${r.display}`)}`;
    s+=T(labelW-8,y+bh/2+4,r.label,{a:"end",fs:11.5,fill:r.dim?C.mut:C.ink});
    s+=`<rect x="${labelW}" y="${y}" width="${barW}" height="${bh}" rx="3" fill="${C.track}"/>`;
    s+=r.hatch
      ?`<rect class="bar" x="${labelW}" y="${y}" width="${barW*0.4}" height="${bh}" rx="3" fill="url(#hatch)"/>`+T(labelW+8,y+bh/2+4,"n/a",{fs:10,fill:C.mut})
      :`<rect class="bar" x="${labelW}" y="${y}" width="${w}" height="${bh}" rx="3" fill="${r.fill||C.accent}"/>`;
    s+=T(labelW+barW+10,y+bh/2+4,r.display,{fs:11.5,w:r.bold?700:400});
    if(r.note)s+=T(W-6,y+bh/2+4,r.note,{a:"end",fs:10.5,fill:C.mut});
    s+=`</g>`;
  });
  return s+`</svg>`;
}

          <rect class="bar" x="86" y="${y+3}" width="${v*150}" height="8" rx="4" fill="${hot?C.accent:C.soft}"/>

      });
      html+=`</svg>`;
    }else{
      const {min,max}=c.scale,W=260,pad=20,x=pad+(c.answer-min)/(max-min)*W;
      html+=`<svg viewBox="0 0 300 56" role="img" aria-label="score example ${c.answer}">
        <line x1="${pad}" y1="26" x2="${pad+W}" y2="26" stroke="${C.track}" stroke-width="8" stroke-linecap="round"/>`;

/* ---------- 05 gate ---------- */
{
  const rows=D.gate.rows;
  const maxSafe=Math.max(...rows.map(r=>Math.max(r.safeApprovedBefore,r.safeApprovedAfter)))*1.1;
  /* dumbbell */
  const DW=920,labelW=190,barW=600,bh=20,gap=14;
  let db=`<svg viewBox="0 0 ${DW} ${14+rows.length*(bh+gap)}" role="img" aria-label="safe commands approved before and after redesign">`;
  rows.forEach((r,i)=>{
    const y=8+i*(bh+gap)+bh/2, x1=labelW+r.safeApprovedBefore/maxSafe*barW, x2=labelW+r.safeApprovedAfter/maxSafe*barW;
    db+=`<g>${tip(`${r.id}: ${r.safeApprovedBefore}% → ${r.safeApprovedAfter}%`)}`;
    db+=T(labelW-10,y+4,short(r.id),{a:"end",fs:11.5});
    db+=`<line class="whisk" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${C.accent}" stroke-width="2.5"/>`;
    db+=`<circle class="dot" cx="${x1}" cy="${y}" r="5" fill="${C.grey}"/><circle class="dot" cx="${x2}" cy="${y}" r="5" fill="${C.accent}"/>`;
    db+=`<g class="lbl">${T(x2+10,y+4,r.safeApprovedAfter+"%",{fs:11})}`+
      (x1-40>labelW+60
        ?T(x1-10,y+4,r.safeApprovedBefore+"%",{a:"end",fs:10,fill:C.mut})
        :T(x1+9,y+15,r.safeApprovedBefore+"% before",{fs:9.5,fill:C.mut}))+`</g></g>`;
  });
  db+=`</svg>`;
  /* high/critical before→after */
  const hmax=Math.max(...rows.map(r=>r.highCritApprovedBefore),1);
  let hc=`<svg viewBox="0 0 920 ${14+rows.length*(bh+gap)}" role="img" aria-label="high or critical commands approved before and after">`;
  rows.forEach((r,i)=>{
    const y=8+i*(bh+gap);
    hc+=`<g>${tip(`${r.id}: ${r.highCritApprovedBefore} → ${r.highCritApprovedAfter} of 60`)}`;
    hc+=T(labelW-10,y+bh/2+4,short(r.id),{a:"end",fs:11.5});
    hc+=`<rect x="${labelW}" y="${y}" width="420" height="${bh}" rx="3" fill="${C.track}"/>`;
    if(r.highCritApprovedBefore>0)
      hc+=`<rect class="bar" x="${labelW}" y="${y}" width="${r.highCritApprovedBefore/hmax*420}" height="${bh}" rx="3" fill="${C.red}"/>`;
    hc+=T(labelW+430,y+bh/2+4,r.highCritApprovedBefore+" → ",{fs:11,fill:r.highCritApprovedBefore?C.red:C.mut});
    hc+=T(labelW+466,y+bh/2+4,String(r.highCritApprovedAfter)+(r.highCritApprovedAfter===0?" ✓":""),{fs:11.5,w:700,fill:r.highCritApprovedAfter===0?C.green:C.red});
    hc+=`</g>`;
  });
  hc+=`</svg>`;
  /* allowApprovedNoTask */
  const allow=hBars(rows.map(r=>({label:short(r.id),value:r.allowApprovedNoTask,display:r.allowApprovedNoTask+"%",
    tip:`${r.id}: ${r.allowApprovedNoTask}% of 50 shell-safety "allow" commands approved without task text`})),
    {aria:"shell-safety allow commands approved, no task text",max:60});
  /* static list */
  const sl=D.gate.staticList;
  const pairs=[
    ["critical blocked","criticalBlocked","criticalTotal","higher is better"],
    ["deny blocked","denyBlocked","denyTotal","higher is better"],
    ["harmless blocked","harmlessBlocked","harmlessTotal","lower is better"],
  ];
  let st=`<svg viewBox="0 0 920 ${16+pairs.length*54}" role="img" aria-label="fixed list coverage before and after">`;
  pairs.forEach(([label,k,tot,dir],i)=>{
    const y=10+i*54,b=sl.before[k]/sl.before[tot],a=sl.after[k]/sl.after[tot];
    st+=T(0,y+6,label,{fs:12,w:600})+T(190,y+6,dir,{fs:10,fill:C.mut});
    st+=`<g>${tip(`before: ${sl.before[k]} of ${sl.before[tot]}`)}<rect x="0" y="${y+14}" width="420" height="10" rx="3" fill="${C.track}"/>
      <rect class="bar" x="0" y="${y+14}" width="${b*420}" height="10" rx="3" fill="${C.grey}"/>${T(430,y+23,"before "+sl.before[k]+"/"+sl.before[tot],{fs:10.5,fill:C.mut})}</g>`;
    st+=`<g>${tip(`after: ${sl.after[k]} of ${sl.after[tot]}`)}<rect x="0" y="${y+30}" width="420" height="10" rx="3" fill="${C.track}"/>
      <rect class="bar" x="0" y="${y+30}" width="${a*420}" height="10" rx="3" fill="${C.accent}"/>${T(430,y+39,"after "+sl.after[k]+"/"+sl.after[tot],{fs:10.5,w:600})}</g>`;
  });
  st+=`</svg>`;
  const rem=D.gate.remainingDenyApprovals.map(x=>`<li>${esc(x)}</li>`).join("");
  const les=D.gate.lessons.map(x=>`<li>${esc(x)}</li>`).join("");
  $("gate").innerHTML=`<div class="num">05</div><h2>Agent command gate</h2>
    <p class="take">After the redesign, no model approved any of the ${h.highCriticalTotal} high- or critical-risk commands.</p>
    <p class="note">${esc(D.gate.redesign)}</p>
    <h3>Safe commands approved <span class="mono" style="font-weight:400;color:${C.mut}">● before → ● after</span></h3><div class="grow">${db}</div>
    <h3>High/critical approved (of 60)</h3><div class="grow">${hc}</div>
    <h3>"Allow"-labelled commands approved, no task text</h3><div class="grow">${allow}</div>
    <h3>Fixed list coverage</h3><div class="grow">${st}</div>
    <h3>Remaining deny approvals</h3><ul class="plain">${rem}</ul>
    <h3>Lessons</h3><ul class="plain">${les}</ul>
    <p class="note">${esc(D.gate.note)}</p>`;
  animateAll($("gate"));
}

    {aria:"external benchmark median latency",labelW:220,valW:70,noteW:170});
  const cons=D.aws.considerations.map(c=>`<li><b>${esc(c.title)}.</b> ${esc(c.body)}</li>`).join("");
  /* architecture svg */
  const box=(x,y,w,hgt,label,sub,stroke=C.ink)=>{
    return `<rect x="${x}" y="${y}" width="${w}" height="${hgt}" rx="8" fill="${C.surface}" stroke="${stroke}" stroke-width="1.2"/>
      ${T(x+w/2,y+(sub?hgt/2-6:hgt/2+4),label,{a:"middle",fs:11.5,w:600})}`+(sub?T(x+w/2,y+hgt/2+10,sub,{a:"middle",fs:9.5,fill:C.mut}):"");
  };
  const arr=(x1,y1,x2,y2,label)=>{
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.mut}" stroke-width="1.3" marker-end="url(#ah)"/>`+
      (label?T(mx,my-4,label,{a:"middle",fs:9.5,fill:C.mut}):"");
  };
  const arch=`<svg viewBox="0 0 920 340" role="img" aria-label="suggested AWS architecture">
    <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${C.mut}"/></marker></defs>
    ${box(10,140,150,60,"App / coding agent")}
    ${box(230,140,170,60,"Lambda","decide + gate",C.accent)}
    ${box(470,50,160,54,"Fixed risk list")}
    ${box(700,10,170,44,"Block / ask human","on match",C.red)}
    ${box(470,120,160,54,"Provider","on no match")}
    ${box(700,90,190,56,"Bedrock: imported model","return_logprobs",C.green)}
    ${box(700,166,190,56,"Bedrock: GPT-6 Luna","Converse · choice only")}
    ${box(700,242,190,56,"OpenRouter / TypeSafe","key in Secrets Manager")}
    ${box(230,262,170,44,"CloudWatch","logs + cost/decision")}
    ${arr(160,170,230,170)}${arr(400,140,470,77)}${arr(630,77,700,32,"match")}
    ${arr(400,170,470,147)}${arr(630,147,700,118,"in-account")}
    ${arr(630,147,700,194,"choice only")}${arr(630,147,700,270,"outside AWS")}
    ${arr(315,200,315,262)}
  </svg>`;
  $("aws").innerHTML=`<div class="num">07</div><h2>Tuning for an AWS / Bedrock shop</h2>
    <p class="take">No decision API runs inside Bedrock today — probabilities need Custom Model Import or SageMaker.</p>
    <h3>Options on AWS today</h3>
    <table><thead><tr><th>option</th><th>typed probabilities?</th><th>data stays in account?</th><th>notes</th></tr></thead><tbody>${optRows}</tbody></table>
    <h3>External benchmark — median latency</h3><div class="grow">${ebBars}</div>
    <p class="note">Source: ${esc(eb.source)}. These are <b>not our measurements</b>.</p>
    <h3>Considerations</h3><ol class="consider">${cons}</ol>
    <h3>Suggested architecture</h3><div class="grow">${arch}</div>`;
  animateAll($("aws"));
}

{
