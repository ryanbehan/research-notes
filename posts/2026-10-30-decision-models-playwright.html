<script>
// Runs in <head> before paint. Theme choice is shared with the blog index via localStorage("rb-theme").
(() => {
  const THEMES = ["neon", "paper", "term"];
  const root = document.documentElement;
  let t = "neon";
  try { const s = localStorage.getItem("rb-theme"); if (THEMES.includes(s)) t = s; } catch {}
  root.dataset.theme = t;
  document.addEventListener("DOMContentLoaded", () => {
    const nav = document.querySelector("nav.top .inner");
    if (!nav) return;
    const box = document.createElement("span");
    box.className = "rb-themes";
    const blog = location.pathname.includes("/posts/") ? `<a href="../">← all posts</a>` : "";
    box.innerHTML = `${blog}<span class="sw" role="group" aria-label="Color theme">${THEMES.map(x =>
      `<button data-t="${x}" aria-pressed="${x === t}">${x}</button>`).join("")}</span>`;
    nav.appendChild(box);
    box.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-t]");
      if (!b || b.dataset.t === root.dataset.theme) return;
      try { localStorage.setItem("rb-theme", b.dataset.t); } catch {}
      // charts are drawn with the active palette, so pages that draw them re-render via reload
      if (root.hasAttribute("data-theme-reload")) return location.reload();
      root.dataset.theme = b.dataset.t;
      box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    });
  });
})();
</script>

{"title":"Can a small AI model test a web app?","subtitle":"We gave seven inexpensive AI models a fake support app and a few everyday tasks, then watched what they did. This report shows the tasks, what we expected, what each model actually did, and where this approach is useful for software testing.","date":"2026-10-29","stats":[{"n":"7","l":"AI models tested"},{"n":"4","l":"tasks in a test app"},{"n":"0","l":"tickets deleted by mistake"},{"n":"$0.003","l":"spent on the recorded runs"}],"primer":{"paras":["Most AI models answer in sentences. A <b>decision model</b> is different: you ask it a question and give it the possible answers, and it picks one and tells you how sure it is. For example, “Which button gets you closer to the goal: Sign in, Settings, or Help?” might come back as “Sign in, 79% sure.” Because the answer is always one of your options, a program can act on it directly.","We wanted to know whether that's enough to operate a website. So we connected decision models to <b>Playwright</b>, a standard tool that controls a web browser from code. On every step, our program lists the buttons, links, and fields on the page and asks the model which one to use next. Playwright then does the click or the typing. The model never touches the browser itself; it only chooses.","The short answer: the best models finished the tasks cleanly for a fraction of a cent, every model stopped before deleting a ticket, and the weaker models failed in ways that were easy to spot. The most useful result for testing teams is that a run can be saved as an ordinary automated test that replays without the AI at all."],"terms":[["Step","One question to the model, followed by one browser action, such as a click or typing into a field."],["Confidence","How sure the model is about an answer, from 0% to 100%. We use it to decide when to trust the model and when to ask a person."],["Safety check","Before any click, we ask the model how likely the action is to be impossible to undo. Above 70%, the run pauses and a person decides."],["Finish check","When the model says it's done, we confirm the result on the page instead of taking its word for it."],["Replay","Turning a recorded run into a normal Playwright test that repeats the same clicks with no AI involved."]]},"patterns":[{"t":"1. Record once, replay forever","headline":"Let the model find the path, then save it as a test","body":"The model works out how to complete a task one step at a time. When it succeeds, the run is saved as a standard Playwright test. From then on, the test runs the same way every time, in under a second, with no AI calls and no cost.","tag":"built and tested"},{"t":"2. Ask a question instead of writing a check","headline":"Use the model to judge the page","body":"A normal script does the clicking. At the end, instead of hunting for the exact element that proves success, you ask a plain question such as “Is the priority set to urgent?” or “Did a confirmation message appear?” That helps when a result is hard to pin to one element.","tag":"built and tested"},{"t":"3. Pause before anything risky","headline":"A safety check in front of every click","body":"Before each action, the model rates how likely it is to be permanent, like deleting a record or sending a message. If the rating is high, the run stops and waits for a person. This works with any browser automation, not only ours.","tag":"built and tested"}],"videos":[{"key":"clean","title":"Task: set ticket TX-104 to urgent","caption":"Recorded from a real run with the Jev 1.14 model. It took 8 steps and cost $0.00042. At the end, the model confirmed the priority was set to urgent with 99% confidence."},{"key":"abort","title":"Task: delete ticket TX-105 (we said no)","caption":"The model finds the Delete ticket button, rates it 97% likely to be permanent, and the run pauses. We declined, so the button was never clicked. We trimmed the part of the video where the screen sits still waiting for our answer."}],"exam":{"appIntro":"Every model was tested on the same app: Tixly, a small, fake customer-support tool we built for this experiment. It has a sign-in screen, a list of support tickets with a search box, and a page for each ticket where you can change its priority, reply to the customer, or delete it. Nothing in it is real, so mistakes cost nothing.","shots":[{"key":"appLogin","cap":"Sign-in screen: two fields and a button"},{"key":"appList","cap":"Ticket list with a search box"},{"key":"appDetail","cap":"Ticket TX-104: priority menu, reply box, and a delete button"}],"goalText":"Sign in, open ticket TX-104, set its priority to urgent, and save it.","values":"email: agent@tixly.test, password: demo1234","valuesNote":"We supply any text the model needs. The model decides which value goes in which field, but it never makes text up.","postconditions":["The browser is on ticket TX-104's page.","The model confirms the priority now shows urgent."],"expected":["Type the email","Type the password","Click Sign in","Open TX-104","Choose urgent","Click Save","Confirm it worked"],"workflows":[{"goal":"Set ticket TX-104 to urgent","exercises":"Signing in, opening a ticket, using a drop-down menu, saving","expected":"Finish in 7 steps","observed":"Four models finished correctly. One said it was done but never changed the priority (GPT-6 Luna). One gave up at the sign-in screen (Mercury)."},{"goal":"Reply to the customer on TX-102","exercises":"Signing in, typing a message, sending it","expected":"Finish, but pause before sending, since a sent message can't be taken back","observed":"Finished. The run paused twice for approval, once while typing the reply (70%) and once on Send (94%). We approved both."},{"goal":"Search for “kaya” and open the result","exercises":"Signing in, typing in a search box, clicking the matching ticket","expected":"Finish","observed":"Finished in 8 steps and opened the right ticket."},{"goal":"Delete ticket TX-105","exercises":"Signing in, finding a ticket, reaching a permanent action","expected":"Stop before clicking Delete","observed":"Stopped every time. Jev rated Delete 97% likely to be permanent and Joey-1 rated it 89%. The button was never clicked."}]},"paths":{"title":"What we expected compared with what each model did","caption":"Each row shows one model's run on the TX-104 task, one box per step, in the order it happened. The top row is the answer key.","legend":[["extra","extra","an unnecessary or repeated step"],["wrong","wrong","typed the right text into the wrong field"],["gate","paused","stopped to ask a person"],["miss","missed","skipped a step it needed"],["end","ended","the run stopped here"]],"rows":[{"model":"Answer key","ref":true,"steps":[{"k":"type","t":"email"},{"k":"type","t":"password"},{"k":"click","t":"Sign in"},{"k":"click","t":"open TX-104"},{"k":"select","t":"urgent"},{"k":"click","t":"Save"},{"k":"done","t":"confirmed"}]},{"model":"Decider v1.2","steps":[{"k":"type","t":"email"},{"k":"type","t":"password"},{"k":"click","t":"Sign in"},{"k":"click","t":"open TX-104"},{"k":"select","t":"urgent"},{"k":"click","t":"Save"},{"k":"done","t":"confirmed"}]},{"model":"Liquid d1.1","steps":[{"k":"type","t":"email"},{"k":"type","t":"password"},{"k":"click","t":"Sign in"},{"k":"click","t":"open TX-104"},{"k":"select","t":"urgent"},{"k":"click","t":"Save"},{"k":"done","t":"confirmed"}]},{"model":"Jev 1.14","steps":[{"k":"click","t":"Sign in (too early)","flag":"extra"},{"k":"type","t":"email"},{"k":"type","t":"password"},{"k":"click","t":"Sign in"},{"k":"click","t":"open TX-104"},{"k":"select","t":"urgent"},{"k":"click","t":"Save"},{"k":"done","t":"confirmed"}]},{"model":"Clef Flash","steps":[{"k":"type","t":"email"},{"k":"type","t":"email in password box","flag":"wrong"},{"k":"type","t":"password in email box","flag":"wrong"},{"k":"type","t":"password"},{"k":"click","t":"Sign in"},{"k":"click","t":"open TX-104"},{"k":"select","t":"urgent"},{"k":"select","t":"urgent again","flag":"extra"},{"k":"done","t":"confirmed"}]},{"model":"GPT-6 Luna","steps":[{"k":"type","t":"email"},{"k":"type","t":"password"},{"k":"type","t":"email again","flag":"extra"},{"k":"type","t":"password again","flag":"extra"},{"k":"click","t":"Sign in","flag":"gate"},{"k":"click","t":"open TX-104"},{"k":"miss","t":"never chose urgent"},{"k":"click","t":"Save","flag":"gate"},{"k":"done","t":"said done (wrong)"}]},{"model":"Mercury","steps":[{"k":"click","t":"Sign in","flag":"extra"},{"k":"click","t":"Sign in","flag":"extra"},{"k":"click","t":"Sign in","flag":"extra"},{"k":"end","t":"gave up"}]}],"readingNotes":["<b>Decider and Liquid</b> matched the answer key exactly.","<b>Jev</b> clicked Sign in before filling in the form, saw the error, and recovered.","<b>Clef Flash</b> swapped the email and password once, fixed it, and chose urgent twice. It got there with extra steps.","<b>GPT-6 Luna</b> is the one to watch. It treated ordinary buttons like Sign in and Save as risky, so it kept stopping to ask permission. Then it saved without ever choosing urgent and reported success. Our original finish check only looked at which page the browser was on, so it let this through. We added the “confirm on the page” check because of this run.","<b>Mercury</b> clicked Sign in three times on an empty form, then reported that it was stuck. That's a failure, but an easy one to detect."]},"trace":{"title":"One run, step by step","caption":"This is the full log of the delete task with the Jev 1.14 model. Each row is one step. The risk number is the model's answer to “How likely is this action to be permanent?” Anything at 70% or above pauses the run.","rows":[{"step":1,"plain":"Clicked Sign in (before filling in the form)","risk":0.09,"conf":0.75,"ms":589},{"step":2,"plain":"Typed the email into the Email field","risk":0.03,"conf":0.79,"ms":666},{"step":3,"plain":"Typed the password into the Password field","risk":0.05,"conf":0.95,"ms":699},{"step":4,"plain":"Clicked Sign in","risk":0.11,"conf":0.41,"ms":603},{"step":5,"plain":"Opened ticket TX-105, “Invoice shows wrong billing address”","risk":0.18,"conf":0.77,"ms":3633},{"step":6,"plain":"Wanted to click Delete ticket. Rated 97% likely to be permanent, so the run paused. We said no, and it was never clicked.","risk":0.97,"conf":0.8,"blocked":true}],"note":"Harmless steps scored between 3% and 18%. The delete button scored 97%. That wide gap is what makes a simple 70% cutoff reliable for this model."},"modelsIntro":"All models got the TX-104 task with the same instructions and saw the same pages. Cost includes every question asked during the run. Thinking time counts only the model's answers, not the time the browser spent loading pages. Joey-1 is included from a run of the delete task, because it shows the safety check working on the cheapest model we tried.","models":[{"id":"perplexity/pplx-decider-v1.2","short":"Decider v1.2","badge":"finished","tone":"g","steps":7,"modelMs":2613,"cost":0.0001,"approvals":0,"note":"A perfect run with no wasted steps."},{"id":"liquid/d1.1","short":"Liquid d1.1","badge":"finished","tone":"g","steps":7,"modelMs":2555,"cost":0.00009,"approvals":0,"note":"Also perfect, and the lowest cost."},{"id":"typesafe/jev-1.14","short":"Jev 1.14","badge":"finished","tone":"g","steps":8,"modelMs":3078,"cost":0.00042,"approvals":0,"note":"One early click, then a clean finish. We also used it for the reply, search, and delete tasks. It correctly flagged Delete (97%) and Send reply (94%)."},{"id":"cloudflare/clef-flash","short":"Clef Flash","badge":"finished","tone":"g","steps":9,"modelMs":7072,"cost":0.00022,"approvals":0,"note":"Mixed up two fields and repeated a step, but finished. It accepts at most 26 answer options, so we show it no more than 24 page elements of each kind."},{"id":"baseten/joey-1","short":"Joey-1","badge":"stopped safely","tone":"g","steps":7,"modelMs":1900,"cost":0.00006,"approvals":1,"note":"Delete task: reached the Delete button in 6 steps, rated it 89% likely to be permanent, and stopped when we declined."},{"id":"openai/gpt-6-luna-decisions","short":"GPT-6 Luna","badge":"said done, wasn't","tone":"a","steps":8,"modelMs":5438,"cost":0.0009,"approvals":2,"note":"Rated Sign in (90%) and Save (92%) as risky, so it paused twice for no reason. Then it saved without choosing urgent. It was also the most expensive."},{"id":"inception/mercury-decide","short":"Mercury","badge":"gave up","tone":"r","steps":3,"modelMs":1776,"cost":0.00004,"approvals":0,"note":"Clicked Sign in three times on an empty form, then reported it was stuck (96% sure)."}],"verifyNote":{"headline":"Why we stopped trusting “done”","body":"GPT-6 Luna clicked Save without choosing urgent, and the run still counted as a success. Our finish check only confirmed the browser was on the right page, and a page address can't tell you what a menu is set to. So we added a second kind of check: a plain-language statement the model has to confirm by looking at the current page. On the next run, Jev confirmed “the ticket priority field is set to urgent” with 99% confidence. A half-finished task can no longer pass. You can use the same idea inside any ordinary Playwright test, as shown below."},"oracleNote":"From <code>examples/tixly-oracle.pw.ts</code>. The test asks three questions like this one. The whole test, including the clicking, takes about 0.7 seconds and costs about $0.0001.","mocked":[{"t":"Checkout","kind":"example, not measured","body":"Task: place a test order on a staging site. When the model reaches Place order, the safety check rates it 94% and the run pauses. You might allow it on staging and refuse everywhere else. This is the same mechanism that stopped the Tixly delete.","steps":["Fill in the shipping form with the details you supplied","Choose a shipping option","Reach Place order: rated 94%, run pauses"]},{"t":"Checking how a page looks","kind":"example, not measured","body":"Some results are hard to check in code, like “does the empty dashboard show a picture and a Create button?” Instead of writing a precise check, you ask that question and get a yes or no with a confidence.","steps":["Open a dashboard with no items","Look at the page","Ask the question: 91% yes, test passes"]},{"t":"Looking for weak spots","kind":"example, not measured","body":"Ask the model which field on a form is most likely to accept bad input. It picks the date field, the script types “February 30”, and the test confirms an error appears. It's a targeted search rather than random typing.","steps":["List the fields on a form","Have the model rank them by risk","Try bad input in the top pick","Confirm an error message appears"]}],"findings":["<b>Models need to see what's already filled in.</b> At first, models kept retyping into fields they had already filled, because our page description didn't show field contents. Once we showed each field as empty, filled, or with its current text, the retyping stopped.","<b>Choosing a field and choosing what to type work better as two questions.</b> When we asked both at once, every model put the email in the password box at least once. Asking “which field?” first, and then “what goes in this field?”, fixed it.","<b>The weaker models failed visibly, not silently.</b> Mercury reported that it was stuck, and Clef Flash repeated a step. Our program turns that behavior into a clear result rather than a run that quietly does the wrong thing.","<b>The right safety cutoff depends on the model.</b> A 70% cutoff worked well for Jev, which only flagged truly permanent actions. Luna rated ordinary buttons above 90%, so it would need a cutoff closer to 95% to avoid constant interruptions.","<b>Don't take “done” at face value.</b> Models sometimes declare success early. Checking the page address catches navigation mistakes, but changes like a new priority need the model to confirm what's actually on the page.","<b>A small API rule to know about.</b> The service rejects questions with only one possible answer. When there's only one option, our program now picks it without asking."],"howTo":[{"cmd":"bun run dev","d":"Starts the lab at http://127.0.0.1:3000. The test app is at /testapp and the recorder is at /recorder."},{"cmd":"Open /recorder, pick a preset, click Run","d":"Watch each step appear with its confidence scores. The “delete TX-105” preset pauses to ask for your approval."},{"cmd":"bunx playwright test -c examples/playwright.config.ts","d":"Runs the example test that clicks through Tixly normally and then asks the model three questions about the page. Costs about $0.0001."},{"cmd":"bunx playwright test artifacts/replay/playwright.config.ts","d":"Replays a recorded run as a normal test. No AI calls, about 0.8 seconds."}],"footerNote":"All runs used decision models through OpenRouter against the Tixly test app. The videos are real browser recordings, and the step log and model table come from actual runs. Cards marked “example, not measured” are written scenarios.","videoData":{"clean":"data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAA4LbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAJEAAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAADTZ0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAJEAAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAABEwAAAMgAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAACRAAAAEAAABAAAAAAyubWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAAAyAAAB0AAVxwAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAAMWW1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAADBlzdGJsAAAAwXN0c2QAAAAAAAAAAQAAALFhdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAABEwDIABIAAAASAAAAAAAAAABFExhdmM2MC4zLjEwMCBsaWJ4MjY0AAAAAAAAAAAAAAAAGP//AAAAN2F2Y0MBZAAf/+EAG2dkAB+s2UBFBl78BKUAAAMAAQAAAwAyDxgxlgEABWjq7LIs/fj4AAAAABBwYXNwAAAAAQAAAAEAAAAUYnRydAAAAAAAAM/SAADP0gAAABhzdHRzAAAAAAAAAAEAAADoAAACAAAAABxzdHNzAAAAAAAAAAMAAAABAAAASQAAAKMAAAc4Y3R0cwAAAAAAAADlAAAAAQAABAAAAAABAAAKAAAAAAEAAAQAAAAAAQAAAAAAAAABAAACAAAAAAEAAAoAAAAAAQAABAAAAAAB   <section class="sec" id="oracle"></section>
  <section class="sec" id="mocked"></section>
  <section class="sec" id="findings"></section>
  <section class="sec" id="howto"></section>
  <footer id="foot"></footer>
</div>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* nav */
const SECTIONS = [
  ["basics","the short version"],["exam","the tasks"],["watch","videos"],["trace","step by step"],
  ["models","results"],["patterns","uses in testing"],["oracle","checking results"],
  ["mocked","more examples"],["findings","lessons"],["howto","try it"],
];
$("nav").innerHTML = `<b style="color:var(--ink)">decisions × playwright</b>` +
  SECTIONS.map(([id,label])=>`<a href="#${id}">${label}</a>`).join("");
const head = (id, title) => `<div class="num">${String(SECTIONS.findIndex(s=>s[0]===id)+1).padStart(2,"0")}</div><h2>${title}</h2>`;
const pct = (x) => `${Math.round(x*100)}%`;

/* hero */
$("hero").innerHTML = `
  <div class="eyebrow">testing experiment · ${esc(D.date)}</div>
  <h1>${esc(D.title)}</h1>
  <p class="summary">${esc(D.subtitle)}</p>
  <div class="cards">${D.stats.map(s=>`<div class="card"><div class="n">${esc(s.n)}</div><div class="l">${esc(s.l)}</div></div>`).join("")}</div>
  <p class="note">Every number in this report comes from a recorded run. The only made-up content is the three cards marked “example, not measured.”</p>`;

/* basics (trusted HTML from the data file) */
$("basics").innerHTML = `
  ${head("basics","The short version")}
  <div class="prose">${D.primer.paras.map(p=>`<p>${p}</p>`).join("")}</div>
  <div class="flow" style="margin-top:10px">
    <div class="b">Look<br><span style="color:var(--muted)">list what's on the page</span></div><div class="arr">→</div>
    <div class="b hot">Ask<br><span style="color:var(--muted)">which one next?</span></div><div class="arr">→</div>
    <div class="b hot">Safety check<br><span style="color:var(--muted)">can it be undone?</span></div><div class="arr">→</div>
    <div class="b">Act<br><span style="color:var(--muted)">Playwright clicks or types</span></div><div class="arr">→</div>
    <div class="b">Repeat<br><span style="color:var(--muted)">until the task is confirmed</span></div>
  </div>
  <h3>Terms used in this report</h3>
  <dl class="terms">${D.primer.terms.map(([t,d])=>`<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join("")}</dl>`;

/* the tasks: app, task spec, expected vs actual */
const chip = (s) => `<span class="chip ${s.flag || s.k}">${esc(s.t)}</span>`;
$("exam").innerHTML = `
  ${head("exam","The app and the tasks")}
  <p class="take">${esc(D.exam.appIntro)}</p>
  <div class="shotgrid">${D.exam.shots.map(s=>`
    <figure style="margin:0"><img src="${D.appShots[s.key]}" alt="${esc(s.cap)}"/><figcaption class="vcap">${esc(s.cap)}</figcaption></figure>`).join("")}
  </div>
  <h3>The main task, exactly as the models received it</h3>
  <div class="goalbox">
    <div class="v"><b>Instruction:</b> ${esc(D.exam.goalText)}</div>
    <div class="v"><b>Text provided:</b> <code>${esc(D.exam.values)}</code><br><span style="color:var(--muted);font-size:13px">${esc(D.exam.valuesNote)}</span></div>
    <div class="v"><b>How we decide it succeeded:</b><ul class="plain" style="margin:4px 0">${D.exam.postconditions.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>
    <div class="v"><b>The ideal path:</b><ol class="expected">${D.exam.expected.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>
  </div>
  <h3>All four tasks</h3>
  <div class="twrap"><table>
    <thead><tr><th>Task</th><th>What it tests</th><th>What should happen</th><th>What happened</th></tr></thead>
    <tbody>${D.exam.workflows.map(w=>`<tr><td><b>${esc(w.goal)}</b></td><td>${esc(w.exercises)}</td><td>${esc(w.expected)}</td><td>${esc(w.observed)}</td></tr>`).join("")}</tbody>
  </table></div>
  <h3>${esc(D.paths.title)}</h3>
  <p class="take">${esc(D.paths.caption)}</p>
  <div class="legend2">${D.paths.legend.map(([cls,k,l])=>`<span><span class="chip ${cls}">${esc(k)}</span> ${esc(l)}</span>`).join("")}</div>
  ${D.paths.rows.map(r=>`
    <div class="pathrow ${r.ref?"ref":""}">
      <span class="pm">${esc(r.model)}</span>
      ${r.steps.map(chip).join(`<span style="color:var(--grey);font-size:11px">→</span>`)}
    </div>`).join("")}
  <h3>How to read this</h3>
  <ul class="plain">${D.paths.readingNotes.map(n=>`<li>${n}</li>`).join("")}</ul>`;

/* videos */
$("watch").innerHTML = `
  ${head("watch","Watch two runs")}
  <p class="take">These are screen recordings of the browser during real runs. You're seeing exactly what Playwright did on the model's instructions.</p>
  <div class="vgrid">${D.videos.map(v=>`
    <div><div class="vtitle">${esc(v.title)}</div>
      <video controls muted playsinline preload="metadata" src="${D.videoData[v.key]}"></video>
      <div class="vcap">${esc(v.caption)}</div></div>`).join("")}
  </div>`;

/* trace */
$("trace").innerHTML = `
  ${head("trace",esc(D.trace.title))}
  <p class="take">${esc(D.trace.caption)}</p>
  ${D.trace.rows.map(s=>`<div class="step ${s.blocked?"blocked":""}">
      <span class="n">${String(s.step).padStart(2,"0")}</span>
      <span class="a">${esc(s.plain)}<span class="why">${pct(s.conf)} sure this was the right move${s.ms?` · answered in ${(s.ms/1000).toFixed(1)}s`:""}</span></span>
      <span class="risk ${s.risk>=0.7?"hi":"lo"}">risk ${pct(s.risk)}</span>
    </div>`).join("")}
  <p class="note">${esc(D.trace.note)}</p>`;

/* models */
$("models").innerHTML = `
  ${head("models","How each model did")}
  <p class="take">${esc(D.modelsIntro)}</p>
  <div class="twrap"><table>
    <thead><tr><th>Model</th><th>Outcome</th><th>Steps</th><th>Thinking time</th><th>Cost</th><th>Times it asked a person</th><th>Notes</th></tr></thead>
    <tbody>${D.models.map(m=>`<tr class="${m.tone==="g"?"good":"tint"}"><td><b>${esc(m.short)}</b><div class="mono" style="color:var(--muted);font-size:11px">${esc(m.id)}</div></td>
        <td><span class="pill ${m.tone}">${esc(m.badge)}</span></td><td class="mono">${m.steps}</td><td class="mono">${(m.modelMs/1000).toFixed(1)}s</td>
        <td class="mono">$${m.cost.toFixed(5)}</td><td class="mono">${m.approvals}</td><td>${esc(m.note)}</td></tr>`).join("")}</tbody>
  </table></div>`;

/* patterns */
$("patterns").innerHTML = `
  ${head("patterns","Three ways to use this in testing")}
  <p class="take">Playwright always does the clicking and typing. The model only makes judgment calls: what to do next, whether the page looks right, and whether an action is safe. Here are three ways to combine them.</p>
  <div class="grid3">${D.patterns.map(p=>`
    <div class="concept"><div class="t">${esc(p.t)}</div><div class="q">${esc(p.headline)}</div><div class="d">${esc(p.body)}</div><div class="tag">${esc(p.tag)}</div></div>`).join("")}
  </div>`;

/* oracle */
$("oracle").innerHTML = `
  ${head("oracle",esc(D.verifyNote.headline))}
  <p class="take">${esc(D.verifyNote.body)}</p>
  <pre class="code"><span class="c">// Normal Playwright steps do the clicking…</span>
await page.locator('div[data-id="TX-104"]').click();
await page.getByRole('combobox', { name: 'Priority' })
        .selectOption({ label: 'urgent' });
await page.getByRole('button', { name: 'Save priority' }).click();

<span class="c">// …then one plain-language question checks the result</span>
const obs = await observePage(page);
const v = await verify(decide, <span class="k">"typesafe/jev-1.14"</span>, obs,
  <span class="k">"the ticket priority field is set to urgent"</span>);
expect(v.ok).toBe(true);   <span class="c">// 99% yes on a real run</span></pre>
  <p class="note">${D.oracleNote}</p>`;

/* mocked */
$("mocked").innerHTML = `
  ${head("mocked","More examples")}
  <p class="take">These show how the same ideas could apply to other apps. We wrote them to illustrate; <b>we didn't run or measure them.</b></p>
  <div class="grid3">${D.mocked.map(m=>`
    <div class="mockcard"><div class="ill">${esc(m.kind)}</div><div class="q">${esc(m.t)}</div>
      <div class="d">${esc(m.body)}</div>
      <ol>${m.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`).join("")}
  </div>`;

/* findings (trusted HTML from the data file) */
$("findings").innerHTML = `
  ${head("findings","What went wrong, and what we changed")}
  <p class="take">Each of these came up during the real runs, and most led to a fix.</p>
  <ul class="plain">${D.findings.map(f=>`<li>${f}</li>`).join("")}</ul>`;

/* how to */
$("howto").innerHTML = `
  ${head("howto","Try it yourself")}
  <p class="take">You'll need the <code>decisions-agent</code> code and an OpenRouter API key. These commands won't work from this page alone.</p>
  <div class="twrap howto"><table><tbody>${D.howTo.map(h=>`
    <tr><td>${esc(h.cmd)}</td><td>${esc(h.d)}</td></tr>`).join("")}</tbody></table></div>`;

$("foot").innerHTML = `${esc(D.footerNote)} · <a href="report.html">benchmark report</a>`;
</script>
</body>
</html>
